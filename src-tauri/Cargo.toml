[package]
name = "moho-mail"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Moho Mail: a Linux email and calendar client"

[lib]
name = "moho_mail_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mail-core = { path = "../crates/mail-core" }
providers = { path = "../crates/providers" }
pim = { path = "../crates/pim" }
proton-bridge-sys = { path = "../crates/proton-bridge-sys" }
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
notify-rust = "4"
tracing = "0.1"
url = "2"
rand = "0.8"
base64 = "0.22"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "open_uri"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ksni = { version = "0.3", features = ["blocking"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true

[features]
# Build Proton Mail Bridge into the app (needs Go and PROTON_BRIDGE_SRC; see README).
proton-bridge = ["proton-bridge-sys/bundled"]
