[package]
name = "providers"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mail-core = { path = "../mail-core" }
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
tokio = { version = "1", features = ["net", "io-util", "time", "macros", "rt-multi-thread", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
futures = "0.3"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "tokio1-rustls", "ring", "webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
hickory-resolver = "0.24"
roxmltree = "0.20"
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
url = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
